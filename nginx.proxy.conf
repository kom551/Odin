# Nginx 示例：/api 反代到 Odin API 网关，/ 提供前端静态资源（history 模式）
server {
    listen 80;
    server_name odin.example.com;

    # 手机相机照片上传较大，放宽请求体限制（默认仅 1MB，会导致 413 上传失败）
    client_max_body_size 15m;

    # 务必改成实际部署路径（apps/web/dist）
    root /path/to/apps/web/dist;
    index index.html;

    # MIME 类型映射：.js -> text/javascript、.css -> text/css 等
    include mime.types;
    default_type application/octet-stream;

    # API 网关：去掉 /api 前缀转发到 Node 网关
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 流式输出必须关闭缓冲并加长超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 上传图片：由 Node 静态托管（data/uploads），转发到 API
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 前端构建产物（Vite 默认输出在 /assets/）：
    # 只按真实文件返回；缺失时返回 404，绝不能回退到 index.html，
    # 否则浏览器请求 .js 会拿到 text/html，报
    # "Failed to load module script ... MIME type of text/html"。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router History 模式：仅对非静态文件的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
